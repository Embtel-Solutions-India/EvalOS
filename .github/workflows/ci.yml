name: EvalOS CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evalos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          DB_TEST_URL: jdbc:postgresql://localhost:5432/evalos?currentSchema=evalos_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: ./mvnw --batch-mode test -Devalos.db.test=true

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run lint
        run: npm run lint

  deploy:
    name: Deploy to EC2
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637442130394:role/EvalOS-GitHub-Deploy-Role
          aws-region: us-east-1

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0b4f356f554f30fb6" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/EvalOS",
              "git pull --ff-only origin main",
              "docker compose --env-file ./backend/.env build frontend backend",
              "docker compose --env-file ./backend/.env up -d frontend backend",
              "docker compose --env-file ./backend/.env ps"
            ]' \
            --comment "EvalOS deployment from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0b4f356f554f30fb6" \
              --query "Status" \
              --output text)

            echo "SSM Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0b4f356f554f30fb6"

                exit 1
                ;;

              *)
                sleep 10
                ;;
            esac
          done
