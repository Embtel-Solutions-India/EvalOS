services:

  postgres:
    image: postgres:16
    container_name: evalos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: evalos
      POSTGRES_USER: evalos
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - evalos-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: evalos-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      SPRING_PROFILES_ACTIVE: prod,testprod
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed-prod,classpath:db/seed-testprod

      DB_URL: jdbc:postgresql://postgres:5432/evalos
      DB_USER: evalos
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      EVALOS_FIELD_KEY: ${EVALOS_FIELD_KEY}
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH}
      DESK_PASSWORD_HASH: ${DESK_PASSWORD_HASH}

      GHL_SALES_BRAND_ID: ${GHL_SALES_BRAND_ID}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      EVALOS_MAIL_FROM: ${EVALOS_MAIL_FROM}

      PORTAL_BASE_URL: ${PORTAL_BASE_URL}
      PORTAL_EXPERT_BASE_URL: ${PORTAL_EXPERT_BASE_URL}
      PORTAL_CLIENT_BASE_URL: ${PORTAL_CLIENT_BASE_URL}
      EVALOS_PORTAL_ORIGINS: ${EVALOS_PORTAL_ORIGINS}
      EVALOS_PORTAL_CLIENT_BRAND: ${EVALOS_PORTAL_CLIENT_BRAND}

      EVALOS_S3_BUCKET: ${EVALOS_S3_BUCKET}
      EVALOS_S3_REGION: ${EVALOS_S3_REGION}

      DRIVE_REQUIRED: ${DRIVE_REQUIRED:-true}
      GOOGLE_DRIVE_KEY_JSON: ${GOOGLE_DRIVE_KEY_JSON:-}

      GHL_API_TOKEN: ${GHL_API_TOKEN:-}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}

      # Case chat (Unit 57): Ably for live updates. Empty = chat works without live updates.
      ABLY_API_KEY: ${ABLY_API_KEY:-}
      EVALOS_STAFF_ORIGIN: ${EVALOS_STAFF_ORIGIN:-}
      EVALOS_PUSH_VAPID_PUBLIC: ${EVALOS_PUSH_VAPID_PUBLIC:-}
      EVALOS_PUSH_VAPID_PRIVATE: ${EVALOS_PUSH_VAPID_PRIVATE:-}
      EVALOS_PUSH_SUBJECT: ${EVALOS_PUSH_SUBJECT:-}

      FORWARD_HEADERS_STRATEGY: framework

    expose:
      - "8080"

    networks:
      - evalos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: evalos-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"
      - "443:443"

    networks:
      - evalos-network
  client:
    build:
      context: ./client-expert
      dockerfile: Dockerfile.client

    container_name: evalos-client
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8081:80"

    networks:
      - evalos-network


  expert:
    build:
      context: ./client-expert
      dockerfile: Dockerfile.expert

    container_name: evalos-expert
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8082:80"

    networks:
      - evalos-network

volumes:
  postgres_data:


networks:
  evalos-network:
    driver: bridge
