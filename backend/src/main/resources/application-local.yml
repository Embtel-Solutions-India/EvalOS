# Local dev: env still wins, but a stock localhost Postgres works out of the box.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evalos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Bounded, for the reason application.yml states at length.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    show-sql: true
  flyway:
    # The seed lives OUTSIDE db/migration, not in a subdirectory of it. Flyway scans a
    # location and all its sub-directories recursively, so while these files sat in
    # db/migration/local a prod boot — whose location is plain `classpath:db/migration`
    # — found and applied them. Keep the two trees siblings: there is no exclude filter
    # in Flyway, so separation is the only thing that keeps the seed out of production.
    locations: classpath:db/migration,classpath:db/seed-local
    # The seed is deliberately numbered V900, above every real migration, so on a
    # dev database that has already run it the next unit's V-N looks like an
    # out-of-order migration and Flyway refuses it. Allowed here only: this is the
    # one profile that applies the seed, and prod keeps the strict default.
    out-of-order: true
    # **Because V906 was deleted, not because missing migrations are acceptable.**
    #
    # The sales-executive seed was removed when the role was. Any database that already applied it
    # carries version 906 in `flyway_schema_history` with no file to match, and Flyway's default
    # `validate-on-migrate` refuses to run at all in that state — which would break every laptop
    # that had ever booted this profile, over a seed row that V30 deletes anyway.
    #
    # Scoped to `missing` alone: a CHECKSUM mismatch (an *edited* applied migration) still fails
    # the boot, which is the check that actually protects the schema. And scoped to this profile
    # and the local integration test — the two that list the disposable seed tree. **Never add
    # this to `application.yml` or a deployed profile**: nothing under `db/migration` is ever
    # deleted, so a missing one there is a real defect and must stop the boot.
    ignore-migration-patterns: "*:missing"

evalos:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-signing-key-change-me-not-for-deployment}
    # base64('local-dev-field-key-not-for-prod'). Throwaway: rows encrypted with
    # it are local rows, and a real key never appears in this file.
    field-key: ${EVALOS_FIELD_KEY:bG9jYWwtZGV2LWZpZWxkLWtleS1ub3QtZm9yLXByb2Q=}
  mail:
    from: ${EVALOS_MAIL_FROM:}
  portal:
    # The two portal dev servers: client on 5174, expert on 5175. They are separate
    # apps under client-expert/ so they can be deployed to separate subdomains, and a
    # missing origin here fails at the preflight looking exactly like a bad token.
    allowed-origins: ${EVALOS_PORTAL_ORIGINS:http://localhost:5174,http://localhost:5175}
    # CHANGED from base (empty there): the seeded IE brand id, for the same reason
    # `ghl.location-id` below carries one — it is not a credential, and it is the value
    # correct for whoever runs this repo.
    client-brand: ${EVALOS_PORTAL_CLIENT_BRAND:11111111-1111-1111-1111-111111111111}
    credential-ttl: ${EVALOS_PORTAL_SIGNIN_LINK_TTL:30m}
  s3:
    # Blank on a laptop, deliberately. The whole app boots with no AWS access and every non-document
    # route works; only the document routes answer 502, naming both variables. Set them to exercise
    # a real bucket from here — the same shape `evalos.drive.required=false` used to provide.
    bucket: ${EVALOS_S3_BUCKET:}
    region: ${EVALOS_S3_REGION:}
  ghl:
    # Every `evalos.ghl.*` value, listed so the whole knob set is visible in one place.
    #
    # The reasoning for each one lives in `application.yml` and is deliberately not repeated
    # here — three copies of an argument is three things that drift. Only the two values this
    # profile actually CHANGES carry a note.
    base-url: ${GHL_API_BASE_URL:https://services.leadconnectorhq.com}
    api-version: ${GHL_API_VERSION:2021-07-28}
    # **Never put a value here — not even locally.** Empty in every profile, on purpose.
    #
    # A real Private Integration Token was once pasted into this placeholder's default over in
    # `application.yml`: a git-tracked file, and the app works with or without it, so nothing
    # would have caught it before a commit. `ConfigSecretsTest` now fails the build if a
    # credential-shaped setting carries a default in a shared profile. A GHL token is also not a
    # throwaway like `JWT_SECRET` above — it reaches a live third-party account holding customer
    # data, so there is no dev-safe value to put here.
    #
    # **Where the real token goes: `backend/config/application-local.yml`.** Spring Boot reads
    # `./config/` after the classpath, so that file overrides this one — verified, not assumed —
    # and `backend/config/` is in `.gitignore`, so it cannot be committed. It survives restarts
    # and needs no `$env:` juggling, which is what kept pulling the value back into this file.
    #
    # `$env:GHL_API_TOKEN = "..."` still works and wins over both, if you prefer a one-off shell.
    #
    # Whichever you use, the value must be the FULL token including the `pit-` prefix. A bare
    # UUID (36 chars) produces an HTTP 401 that reads like a scope problem; a whole PIT is 40.
    # `GhlPipelineClient` logs `token length=` at startup so this is checkable without pasting
    # the value anywhere.
    token: ${GHL_API_TOKEN:}
    # CHANGED from base (empty there): International Evaluations' sub-account.
    #
    # A location id is not a secret — it appears in every GHL URL and grants nothing without the
    # token — so it is defaulted for the same reason the datasource above is: it is the value
    # that is correct for whoever runs this repo, so a developer holding a token sets ONE
    # variable rather than two and cannot mistype the other into a confusing 502.
    #
    # It does not make an unconfigured laptop look configured: `GhlPipelineClient` needs the
    # token AND the location non-blank, so with no token the screen still answers 502 naming
    # both. And one value is the ceiling — XpertsPortal has nowhere to go until Unit 25 moves
    # the location onto `brand`.
    # 2026-09-14: was defaulted to kBumF0uUOmMBB5bneYjx, the sub-account IE abandoned on
    # 2026-09-11 with no contact migration. A default pointing at a dead account is worse than
    # no default: every GHL-backed screen renders empty and looks like a bug rather than a
    # misconfiguration. The new location is the default now; `.env` still overrides it, and
    # `.env` is what VS Code actually launches with.
    location-id: ${GHL_LOCATION_ID:WY6bW2xUCI8Tz8gw7aLJ}
    # **Unit 43's intake funnel, by name for the same reason as every other pipeline here.**
    # A client picking a service opens an opportunity on this pipeline at the stage below, which
    # is what puts a self-service lead on a salesperson's board the moment they start rather than
    # when they finish.
    #
    # **Blank by default, and that is the safe direction.** `GhlPipelineClient.pipelineNamed`
    # matches nothing on an empty name and answers 502 — so an unconfigured environment refuses
    # to open a request and says why, instead of filing every client's application into whichever
    # pipeline GHL happened to return first.
    #
    # **There is no stage property beside this, and that is a decision.** EvalOS puts the
    # opportunity on this pipeline and stops: which stage it lands in, and who it is assigned to,
    # are GHL's automation's job. A `hot-stage-name` existed here briefly and was removed — it made
    # EvalOS hold a second opinion about pipeline placement, which goes stale the first time
    # somebody reworks the workflow in GHL.
    intake-pipeline-name: ${GHL_INTAKE_PIPELINE_NAME:}
    # The GHL opportunity custom field that carries the requested service — the one input GHL's
    # own workflow needs to route a client's request to the right pipeline.
    #
    # **THIS IS WHAT MAKES "assign the pipeline by service" POSSIBLE, and it is the whole of
    # EvalOS's part in it.** A GHL workflow triggered by opportunity-created can branch on a custom
    # field; it cannot branch on the free text in the opportunity's NAME, which is the only place
    # the service appeared before. So EvalOS states the fact it owns — which service was asked for
    # — and GHL decides which pipeline that belongs on. Mapping eighteen services onto four sales
    # pipelines is a business rule, and it lives in the workflow for the same reason the stage
    # does: a copy here goes stale the first time somebody reworks the routing over there.
    #
    # **The value sent is the service ID** (`academic_evaluation`, `eb1a_expert_opinion_letter`, …
    # see the client portal's `serviceCatalog.ts`), not the display name. The name is for a human
    # reading a board and changes when the catalog is reworded; the id is the stable slug a
    # workflow condition can be written against.
    #
    # **The GHL custom field ID, not its name or key** — an opaque 20-character string, the same
    # shape as `team_member.ghl_pipeline_id` and for the same reason: a field renamed in GHL must
    # not silently stop routing. Read it from GHL under Settings → Custom Fields (object:
    # Opportunity), or from `GET /api/sales/opportunity-fields`, which the sales desk already
    # calls.
    #
    # **Blank omits the field and nothing else changes.** The deal is still opened on the intake
    # pipeline and still names the person and the service; it simply lands wherever GHL's default
    # routing puts it. An environment that has not created the field yet must not lose the lead
    # over it.
    opportunity-service-field: ${GHL_OPPORTUNITY_SERVICE_FIELD:}
    # The GHL opportunity custom field that says the client finished the questionnaire.
    #
    # **This exists because of D10**: the opportunity is opened when the client PICKS a service, not
    # when they submit, so that a client who abandons halfway still reaches a salesperson. The cost
    # of that decision is that a deal on the board says nothing about whether it is somebody
    # browsing or a finished request. This field is the difference, and it gives GHL a second
    # workflow trigger — notify, move a stage, start a sequence — without EvalOS holding any opinion
    # about which.
    #
    # The value written is the constant `SUBMITTED`. Deliberately not configurable: a value a
    # deployer could change is one a GHL workflow condition would have to be kept in step with by
    # hand, and there is nothing to gain from the two disagreeing.
    #
    # A GHL custom field ID, same shape and same sourcing as the line above. Blank skips the call —
    # the request is still submitted in EvalOS, which is where it lives.
    opportunity-submitted-field: ${GHL_OPPORTUNITY_SUBMITTED_FIELD:}
    # The GHL opportunity custom field carrying EvalOS's own opportunity id -- the CORRELATION KEY.
    #
    # **This is `00d` §6.1, which calls it "the single biggest sequencing error in `00c`".** The
    # outbox gives at-least-once delivery, and `POST /opportunities/` is not idempotent, so a retry
    # after a TIMEOUT is exactly how one opportunity becomes two: EvalOS cannot tell "GHL never got
    # it" from "GHL got it and the answer was lost". The fix is a key EvalOS chooses, writes into a
    # custom field on create, and can look for afterwards.
    #
    # **The key is persisted BEFORE the call**, in `opportunity.id` -- a key minted in memory and
    # lost to a timeout is a key no retry can search for.
    #
    # **Reading it back is not a filter GHL offers, and that is a correction to §6.1's wording.**
    # Verified against the API: neither `GET /opportunities/search` nor the advanced POST accepts a
    # custom-field filter. The implementable form is to ask GHL for the CONTACT's opportunities --
    # `contactId` IS a supported filter -- and match the correlation value locally. One contact has
    # a handful of deals, and a retry-after-timeout is rare.
    #
    # A GHL custom field ID, same shape and sourcing as the two above. Blank omits the field: the
    # deal is still created, and the duplicate risk on a retry is simply the one that exists today.
    opportunity-correlation-field: ${GHL_OPPORTUNITY_CORRELATION_FIELD:}
    # Unit 36's single-brand ceiling; the reasoning is in the base profile.
    #
    # **Defaulted to International Evaluations, which is the brand that owns `location-id` above.**
    # Blank — what this line used to be — means no member of ANY brand may hold SALES or MARKETING,
    # so the desks Units 36-41 built were unreachable on every laptop. Naming IE means only IE's
    # members may, and `PipelineAssignmentService` answers 400 for anybody else; XpertsPortal gets a
    # sales desk the day it gets its own GHL location, which is Unit 25.
    #
    # A brand id is not a credential — it is the seeded UUID present in every local database — so it
    # carries a default here for the same reason `location-id` and the three pipeline names do.
    # `db/seed-local/V908` seeds the five logins that depend on this being set.
    sales-brand: ${GHL_SALES_BRAND_ID:11111111-1111-1111-1111-111111111111}
    board-cache-ttl: ${GHL_BOARD_CACHE_TTL:2m}
    # Connect and read timeout on each GHL request. Required because this runs in a
    # controller-triggered path, and a bound is what keeps it "one bounded request" rather than
    # long-lived work (invariant 6). The read is paginated, so the bound is per page and not for
    # the whole read.
    timeout: ${GHL_TIMEOUT:10s}
