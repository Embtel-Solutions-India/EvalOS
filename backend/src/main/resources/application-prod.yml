# Production: every value comes from the environment. No defaults, no secrets here.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

evalos:
  drive:
    # Restated here rather than inherited silently: this profile's convention is that
    # every value comes from the environment, so the one setting that makes a missing
    # Google service-account key a boot failure should be visible in the file a
    # deployer reads. GOOGLE_DRIVE_KEY_JSON or GOOGLE_APPLICATION_CREDENTIALS must be
    # set, and the grant behind it must be per brand-folder-tree — a service account
    # with blanket access to both brands' Drives is a cross-brand hole outside the
    # database that no brand_id predicate can close.
    #
    # Three units write through this key now, not one: Unit 13's redacted profile, Unit
    # 21's client document upload and Unit 15's signed letter. Since the e-signature
    # provider was dropped it is the only external credential the production path needs.
    required: true
  portal:
    # No default, on purpose, and this is a change: the base profile defaults this to the
    # Vite dev server because that is correct on every developer's laptop, which makes it
    # actively dangerous in production. An unset value there does not fail — it mints
    # links pointing at localhost:5173 and hands them to clients and experts, who get a
    # dead page. Since dropping the signature provider, an expert's *only* route to the
    # letter is one of these links, so a wrong origin now blocks signing too.
    #
    # So it follows the JWT_SECRET / EVALOS_FIELD_KEY rule instead: an environment that
    # forgets it must fail to start rather than run on a guess. This is the client- and
    # expert-facing origin, not the API's.
    base-url: ${PORTAL_BASE_URL}
  ghl:
    # Every `evalos.ghl.*` value, listed for the reason `drive.required` above is restated: this
    # profile's convention is that a deployer can see what they are expected to set. The
    # reasoning for each lives in `application.yml`; only what matters to a deployment is here.
    base-url: ${GHL_API_BASE_URL:https://services.leadconnectorhq.com}
    api-version: ${GHL_API_VERSION:2021-07-28}
    # **The one place this profile deliberately does NOT follow "an environment that forgets it
    # must fail to start."** Stated because it otherwise reads as an oversight.
    #
    # `JWT_SECRET`, `EVALOS_FIELD_KEY`, `DRIVE_REQUIRED` and `PORTAL_BASE_URL` are fatal because
    # getting them wrong is either unrecoverable or reaches an outsider: a guessed signing key,
    # plaintext at rest, an upload failing in front of a waiting client, a portal link pointing
    # at somebody's laptop. A missing GHL token is neither — it gates ONE read-only GM screen,
    # which answers 502 naming exactly what to set. Refusing to boot the whole application over
    # one internal dashboard is the disproportionate choice.
    #
    # Must be a GHL **Private Integration Token scoped `opportunities.readonly` and nothing
    # wider**: EvalOS never writes to GHL (invariant 2) and the client has no write method, so a
    # read-only grant means a mistake in either place is still not a write. **Never a literal
    # here** — `ConfigSecretsTest` fails the build on a defaulted credential.
    token: ${GHL_API_TOKEN:}
    # ONE location for the whole deployment, and note the ceiling before planning around it: a
    # second brand cannot be configured, because there is one value and nowhere to put another.
    # **Do not add a second property** — that reintroduces the global-credential shape Unit 25
    # exists to remove; XpertsPortal needs that unit.
    #
    # Whatever is set here is one brand's sub-account, so the funnel shows one brand's figures.
    # The screen says "one GHL location" rather than naming a brand, because EvalOS has no
    # mapping from a location to a brand yet and must not imply one.
    location-id: ${GHL_LOCATION_ID:}
    # Matched by NAME, not by id. A rename in GHL therefore breaks this screen with a stated 502
    # rather than an empty funnel that reads as a bad month — and the fix is an environment
    # change, not a deploy.
    ads-pipeline-name: ${GHL_ADS_PIPELINE_NAME:Google ADS Pipeline}
    # The email marketing funnel, by name for the same reason. All three defaults are the names the
    # live location actually uses today, so a deployment sets none of them unless GHL renames one.
    email-pipeline-name: ${GHL_EMAIL_PIPELINE_NAME:Shivangi's Email Marketing}
    # The sales funnel. Written with ONE space where GHL stores two — the client collapses
    # whitespace before matching, so this is correct as written; see the base profile.
    sales-pipeline-name: ${GHL_SALES_PIPELINE_NAME:Aditya's pipeline}
    # Per page, not for the whole paginated read. This runs on a request path, so the bound is
    # what keeps it inside invariant 6's "one bounded request".
    timeout: ${GHL_TIMEOUT:10s}
    # A WRITE's bound, and deliberately more generous than the read's. A read that times out costs
    # a stale screen; a write that times out leaves the outcome UNKNOWN - GHL may have applied it -
    # and there is no safe automatic retry. Waiting longer for the truth beats telling a sales
    # executive their stage move failed when it did not. Unit 29.
    # The rate limiter, not a speed-up: without it, N open dashboards are N multi-page GHL reads
    # per refresh and GHL's own limit becomes an EvalOS outage. Do not shorten it in a deployed
    # environment — the local profile does, and says why.
    cache-ttl: ${GHL_CACHE_TTL:PT5M}

server:
  # MUST be `framework` if anything terminates the connection in front of the app — a
  # load balancer, an ingress, a reverse proxy. Left unset, Spring does not resolve
  # X-Forwarded-For, every portal caller resolves to the proxy's address, and they all
  # share one rate-limit budget: one client can lock out every other.
  #
  # Do NOT set it when the app is directly exposed. Honouring X-Forwarded-* with nothing
  # in front lets any caller present a fresh address per request and walk straight past
  # that same limit. There is no safe default, which is why this is a deliberate
  # deployment decision and not a value shipped here.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
