<!--
  One template for the four case progress mails (Unit 64c, D58): checklist, draft ready, expert
  signing, delivered. They differ only in words, which MailTemplates.CaseUpdate holds. No
  credential here: the button is a deep link and the portal sends a signed-out reader to sign in.
-->
<h1 style="margin:0 0 16px 0; font-size:22px; line-height:30px; font-weight:600; color:#10264A;">
  {{heading}}
</h1>

<p style="margin:0 0 20px 0; font-size:15px; line-height:24px; color:#142B4A;">
  {{intro}}
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0; border:1px solid #E3E8EF; border-radius:8px;">
  <tr>
    <td style="padding:12px 16px; font-size:13px; line-height:20px; color:#5A6B80;">Service</td>
    <td style="padding:12px 16px; font-size:14px; line-height:20px; color:#142B4A; font-weight:600;" align="right">{{service}}</td>
  </tr>
  <tr>
    <td style="padding:12px 16px; border-top:1px solid #E3E8EF; font-size:13px; line-height:20px; color:#5A6B80;">Case reference</td>
    <td style="padding:12px 16px; border-top:1px solid #E3E8EF; font-size:14px; line-height:20px; color:#142B4A; font-weight:600;" align="right">{{caseCode}}</td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td align="center" bgcolor="#E31B23" style="border-radius:8px;">
      <a href="{{link}}"
         style="display:inline-block; padding:13px 28px; font-family:Inter,Arial,Helvetica,sans-serif; font-size:15px; font-weight:600; line-height:20px; color:#FFFFFF; text-decoration:none; border-radius:8px;">
        {{buttonLabel}}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0; padding-top:20px; border-top:1px solid #E3E8EF; font-size:13px; line-height:20px; color:#5A6B80;">
  {{note}} Questions? Write to {{supportEmail}}.
</p>
