<!doctype html>
<!--
  The one wrapper every client email is built from.

  WHY IT LOOKS LIKE 2005. Email is not the web: Outlook on Windows renders with Word, which has no
  flexbox, no grid and no external stylesheet. So the layout is nested tables with width attributes
  and every rule is an inline style. That is the only thing that renders the same in Outlook, Gmail,
  Apple Mail and a phone.

  THE PALETTE IS THE LOGO'S, shared with the portals (resolved to hex, because a CSS variable does
  not survive an email client):
    navy         #10264A   headings, links, the logo's wordmark
    brand red    #E31B23   the one button, and the stripe under the banner
    text         #142B4A   body text
    muted        #5A6B80   secondary text and the footer
    hairline     #E3E8EF   borders
    page         #F5F7FA   the page behind the card; the panels inside it
  The card is white with a 14px radius (Outlook ignores the radius and shows square corners, which
  is acceptable). Type is Inter with an Arial fallback: Inter is not installed on most mail clients,
  so Arial is what most readers actually get.

  THE BANNER: the logo sits in a white band across the top of the card, with a red stripe under it.
  The mark is 1230x290 (4.24:1), so it is 320x75 — width and height are stated as attributes AND in
  the inline style, because Outlook reads the attributes and several webmail clients override them
  from the style; setting one without the other renders the logo at 1230px in exactly one client.
  The alt text is the company name, which is what a client that blocks images shows.

  CONTRAST, measured: white on #E31B23 is 4.4:1, which passes AA for the 15px bold button label
  (large-text threshold is 3:1 at 14px bold). Headings and links are navy on white, 15.6:1.

  PLACEHOLDERS are double-brace names, replaced by MailTemplates. Anything a client supplied is
  HTML-escaped on the way in; the link is built by EvalOS and is the one value that is not.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F5F7FA; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

    <!-- Preheader: the grey line a client sees beside the subject in their inbox. -->
    <div style="display:none; font-size:1px; color:#F5F7FA; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
      {{preheader}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F7FA;">
      <tr>
        <td align="center" style="padding:24px 12px 40px 12px;">

          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border:1px solid #E3E8EF; border-radius:14px;">

            <!-- Banner: the logo, then the red stripe. -->
            <tr>
              <td align="center" style="padding:28px 24px 24px 24px; border-bottom:4px solid #E31B23; border-radius:14px 14px 0 0;">
                <a href="{{siteUrl}}" style="text-decoration:none;">
                  <img src="{{logoUrl}}" width="320" height="75" alt="International Evaluations"
                       style="display:block; border:0; outline:none; text-decoration:none; width:320px; max-width:100%; height:75px;">
                </a>
              </td>
            </tr>

            <!-- The message. -->
            <tr>
              <td style="padding:32px 36px 28px 36px; font-family:Inter,Arial,Helvetica,sans-serif; color:#142B4A;">
                {{content}}
              </td>
            </tr>

            <!-- Footer, inside the card. Company, site and the support address, and NOTHING ELSE: a
                 postal address or a phone number nobody confirmed is worse than none, because a
                 client will try it. -->
            <tr>
              <td style="padding:20px 36px 28px 36px; background-color:#F5F7FA; border-top:1px solid #E3E8EF; border-radius:0 0 14px 14px; font-family:Inter,Arial,Helvetica,sans-serif; font-size:12px; line-height:19px; color:#5A6B80;">
                <p style="margin:0 0 6px 0;">
                  <strong style="color:#10264A;">International Evaluations</strong>
                </p>
                <p style="margin:0 0 6px 0;">
                  Credential evaluations and expert opinion letters.
                  <a href="{{siteUrl}}" style="color:#10264A; text-decoration:underline;">internationalevaluations.com</a>
                </p>
                <p style="margin:0 0 6px 0;">
                  Questions? Reply to this message or write to
                  <a href="mailto:{{supportEmail}}" style="color:#10264A; text-decoration:underline;">{{supportEmail}}</a>.
                </p>
                <p style="margin:12px 0 0 0; color:#7B8AA0;">
                  {{footerNote}}
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
