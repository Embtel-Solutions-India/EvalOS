<!doctype html>
<!--
  The one wrapper every client email is built from.

  WHY IT LOOKS LIKE 2005. Email is not the web: Outlook on Windows renders with Word, which has no
  flexbox, no grid, no `max-width` on a div worth trusting and no external stylesheet at all. So the
  layout is nested tables with width attributes, every rule is an inline style, and nothing here is
  a class. That is not carelessness, it is the only thing that renders the same in Outlook, Gmail,
  Apple Mail and a phone.

  THE PALETTE IS THE CLIENT PORTAL'S OWN TOKENS, resolved to hex because a CSS variable does not
  survive an email client:
    --primary            #003152   the deep navy the logo sits in
    --foreground         #11212C   body text
    --muted-foreground   #5C6E7A   secondary text and the footer
    --accent             #EBF4F9   the tinted panel
    --border             #DCE4EA   hairlines
    --background         #FBFCFD   the page behind the card

  PLACEHOLDERS are double-brace names, replaced by MailTemplates. Anything a client supplied is
  HTML-escaped on the way in; the link is built by EvalOS and is the one value that is not.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#FBFCFD; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

    <!-- Preheader: the grey line a client sees beside the subject in their inbox. Hidden in the
         body itself, which is why it carries the zero-height/opacity belt and braces. Without one,
         clients show the first words of the layout instead, which is usually the alt text. -->
    <div style="display:none; font-size:1px; color:#FBFCFD; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
      {{preheader}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FBFCFD;">
      <tr>
        <td align="center" style="padding:24px 12px 40px 12px;">

          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

            <!-- Logo. An <img> with an explicit width and height: a client that blocks images by
                 default (Outlook's default) still reserves the space, so the layout does not jump
                 when the reader chooses to load it. The alt text is the company name because that
                 is what a blocked image should say. -->
            <tr>
              <td align="center" style="padding:8px 0 20px 0;">
                <a href="{{siteUrl}}" style="text-decoration:none;">
                  <img src="{{logoUrl}}" width="152" height="70" alt="International Evaluations"
                       style="display:block; border:0; outline:none; text-decoration:none; width:152px; height:70px;">
                </a>
              </td>
            </tr>

            <!-- The card. -->
            <tr>
              <td style="background-color:#FFFFFF; border:1px solid #DCE4EA; border-radius:10px; padding:32px 32px 28px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#11212C;">
                      {{content}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer. Company, site and the support address, and NOTHING ELSE: a postal address
                 or a phone number nobody confirmed is worse than none, because a client will try
                 it. -->
            <tr>
              <td style="padding:24px 8px 0 8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:19px; color:#5C6E7A;">
                <p style="margin:0 0 6px 0;">
                  <strong style="color:#11212C;">International Evaluations</strong>
                </p>
                <p style="margin:0 0 6px 0;">
                  Credential evaluations and expert opinion letters.
                  <a href="{{siteUrl}}" style="color:#085A91; text-decoration:underline;">internationalevaluations.com</a>
                </p>
                <p style="margin:0 0 6px 0;">
                  Questions? Reply to this message or write to
                  <a href="mailto:{{supportEmail}}" style="color:#085A91; text-decoration:underline;">{{supportEmail}}</a>.
                </p>
                <p style="margin:12px 0 0 0; color:#8496A1;">
                  {{footerNote}}
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
