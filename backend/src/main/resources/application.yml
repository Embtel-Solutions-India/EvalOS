spring:
  application:
    name: evalos
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # **The whole of how EvalOS sends mail, and the whole of how the provider is chosen** (2026-09-18).
  # There is one transport, `smtp`, because every transactional provider speaks it — so switching
  # provider is these four values and a restart, with no build, no new class and no vendor SDK.
  # That replaced a Brevo transport that spoke `POST /v3/smtp/email`; it was the second
  # provider-specific transport in a year to be written and then deleted (GHL was the first).
  #
  # **The username is NOT your account email on most providers.** That is the single most common
  # way this is misconfigured, and it fails as a 535 that reads like a bad password:
  #
  #   Provider   MAIL_HOST                MAIL_PORT  MAIL_USERNAME          MAIL_PASSWORD
  #   ---------- ------------------------ ---------- ---------------------- -----------------------
  #   Brevo      smtp-relay.brevo.com     587        the SMTP login on its  an SMTP key (xsmtpsib-),
  #                                                  "SMTP & API" page      NOT the API key
  #   Resend     smtp.resend.com          587        the literal `resend`   the API key (re_…)
  #   Mailgun    smtp.mailgun.org         587        postmaster@<domain>    that mailbox's password
  #   Postmark   smtp.postmarkapp.com     587        the server API token   the same token again
  #   SES        email-smtp.<region>.     587        the SMTP username IAM  its SMTP password —
  #              amazonaws.com                       hands you              derived, not the secret key
  #
  # `EVALOS_MAIL_FROM` must be an address the provider has VERIFIED for the domain, or every send
  # is refused per-message. A blank host degrades rather than failing the boot: the transport
  # reports itself unconfigured and clients are told to contact us — see `evalos.mail.from`.
  #
  # Port 587 with STARTTLS everywhere. If a provider ever needs implicit TLS on 465, that is
  # `mail.smtp.ssl.enable: true` and `starttls` off — not a code change either.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # **Never a value here, not even locally** — ConfigSecretsTest fails the build on a
    # credential-shaped setting carrying a default in a shared profile. The real value goes in
    # the repo-root `.env` (gitignored) or the environment.
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # **Jakarta Mail defaults all three of these to INFINITE.** Required for the same reason
      # `evalos.ghl.timeout` below is: this send runs inside a controller-triggered @Transactional,
      # from a route that is unauthenticated and permits 60 requests/min/IP. A black-holed SMTP
      # host with no bound parks the request thread AND its Hikari connection forever, and enough
      # of those take the staff API down with the portal. A bound is what keeps it "one bounded
      # request" (invariant 6).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema. Never create/update.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Two endpoints now: the expert roster sheet (Unit 11) and the client document upload
      # (Unit 30). **The trade this block deferred to "Unit 21, not before" is settled here**,
      # because Unit 30 is that upload under a different number.
      #
      # `file-size-threshold` still equals `max-file-size`, and that is the load-bearing line:
      # above the threshold the container spools to a temp file, and EvalOS hosts no files
      # (invariant 14). Keeping them equal buys "never spools to disk" by buffering the part in
      # heap instead — so the cap and the per-request heap exposure are the same number.
      #
      # 15 MB because a scanned transcript is not a roster sheet. At 50-100 cases per brand per
      # month the concurrent-upload count is tiny, so 15 MB of transient heap per in-flight upload
      # is affordable; at ten times the volume this becomes the streaming rewrite the old note
      # described, not a bigger number.
      #
      # **`max-request-size` is deliberately LARGER than `max-file-size`.** They were equal, which
      # meant a file at exactly the cap plus its `checklistItemId` field exceeded the request cap
      # and was rejected for being one form field too big — a limit that fires before the one the
      # user was told about.
      max-file-size: ${UPLOAD_MAX_SIZE:15MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:16MB}
      file-size-threshold: ${UPLOAD_MAX_SIZE:15MB}

evalos:
  security:
    jwt:
      # HS256 signing key, 32 bytes minimum. No default on purpose: an
      # environment that forgets it must fail to start, not sign with a guess.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT8H}
    # AES-256 key for the one encrypted field (expert.payment_detail), base64 of
    # exactly 32 bytes. No default, for the same reason as the signing key: an
    # environment that forgets it must fail to start, not write plaintext.
    field-key: ${EVALOS_FIELD_KEY}
  workload:
    # How many open cases a Case Manager is considered fully loaded by. The denominator behind
    # every capacity percentage on the PM dashboard, and therefore behind ui-context.md's fixed
    # RAG bands (green <70%, amber 70-90%, red >90%).
    #
    # One number for the brand rather than a column on team_member, deliberately: per-person
    # capacity needs an admin screen to maintain and a reason to differ, and neither exists yet.
    # Add `team_member.capacity` the day part-time or junior loads actually diverge — the bands
    # and the display do not change when it does.
    cases-per-cm: ${WORKLOAD_CASES_PER_CM:12}
  sales:
    # The GM overview's denominator: how much won business the month is aiming at. One number for
    # the selling brand, on the same shape as `workload.cases-per-cm` and
    # `roster.monthly-onboarding-target` — the figure was always computable, only the target had
    # nowhere to live.
    #
    # **Zero means "no goal", and the tile then shows the amount alone** rather than a percentage
    # of nothing. That is also why the percentage is suppressed on any window that is not a
    # calendar month: a monthly target against a week is arithmetic dressed as a business figure.
    monthly-goal: ${SALES_MONTHLY_GOAL:0}
    # How far back "won this month" looks for deals to bucket.
    #
    # **This is not a tuning knob, it is a correctness bound.** GHL's opportunity search filters
    # on `createdAt` and offers no filter on `lastStatusChangeAt`, so the only way to find a deal
    # WON in September that was OPENED in July is to read the wins over a window wide enough to
    # contain the sales cycle and bucket them in EvalOS. Set this shorter than the real sales
    # cycle and the won figure is silently low; set it much longer and the read gets slower for
    # nothing. 180 days is a comfortable multiple of a credential-evaluation sale.
    #
    # ponytail: goes away at Unit 44 — a mirrored `opportunity` table makes this one WHERE clause.
    won-lookback-days: ${SALES_WON_LOOKBACK_DAYS:180}
  roster:
    # How many experts the network aims to onboard each month. The denominator behind the ENM's
    # "onboarded vs target" tile. One number per brand for the same reason cases-per-cm is
    # (decision 4's shape): the count over expert.date_onboarded was always computable, only the
    # target had nowhere to live.
    monthly-onboarding-target: ${ROSTER_MONTHLY_TARGET:5}
  mail:
    # Unit 42 — EvalOS's ONLY outbound mail, and invariant 14 is amended to exactly this much:
    # proving control of a client's own address. Set-password and reset-password, nothing else.
    # A status email, a marketing email or a notification email is a different decision and gets
    # argued in its own unit.
    #
    # **Blank degrades rather than failing the boot.** An environment that forgets it serves the
    # whole app and answers NO_PASSWORD with "please contact us" — the same reasoning that gave
    # GHL_API_TOKEN an empty default rather than a fatal one. A password reset is recoverable by
    # a support conversation; a refused boot is not recoverable by anyone.
    from: ${EVALOS_MAIL_FROM:}
    # Who carries the two messages EvalOS sends, by MailTransport bean name. **`smtp` is the only
    # one there is** (2026-09-18), and the provider it reaches is `spring.mail.*` above — see the
    # table there. A `ghl` transport and a `brevo` transport each existed for a few months and are
    # deleted: both were a class, a config block, a credential and a live test proving one vendor.
    #
    # **The setting stays even at one implementation.** It is the seam ClientMailerTest fakes, and
    # a name that matches nothing fails at startup saying what it found — falling back silently
    # would be discovered by a client who never got their link.
    transport: ${EVALOS_MAIL_TRANSPORT:smtp}
  portal:
    # Which brand this portal deployment serves. **NOT evalos.ghl.sales-brand** — that one names
    # which brand's STAFF may hold the SALES and MARKETING roles, a staff-authorization ceiling
    # on the normal chain. Nothing on the portal chain has roles. A second brand is a second
    # portal deployment with its own value here.
    client-brand: ${EVALOS_PORTAL_CLIENT_BRAND:}
    # How long a set-password or reset-password link lives. Ten minutes: long enough to walk
    # to another device, short enough that a forwarded mailbox is not a standing credential.
    #
    # **The key and its variable deliberately do not match, and this is not an oversight.**
    # ConfigSecretsTest fails the build on any variable whose NAME contains CREDENTIAL and which
    # carries a non-empty default — a deliberately blunt rule, because guessing secrets from their
    # values misses short ones. A TTL is not a secret, so the variable is named for what it is to
    # a deployer (the sign-in link's lifetime) instead. Renaming it to EVALOS_PORTAL_CREDENTIAL_TTL
    # to "fix" the mismatch reintroduces that build failure.
    credential-ttl: ${EVALOS_PORTAL_SIGNIN_LINK_TTL:10m}
    # How long an unproved sign-up is kept before PORTAL_CLEANUP removes it (D3a).
    #
    # **Thirty days, and generous on purpose.** This is the window in which a real client who
    # signed up, never opened the mail and came back still finds their own row instead of being
    # told "we couldn't find that email" for a second time. **Only self-service sign-ups are
    # eligible** (`created_via = 'SIGNUP'`, V59) with no password set, and the sweep skips any that
    # acquired a token, an application or a session. A client seeded by V45 is never touched at any
    # cutoff — so shortening this tidies the table and costs a returning client; it protects
    # nothing extra.
    abandoned-sign-up-after: ${EVALOS_PORTAL_ABANDONED_AFTER:30d}
    # The portal frontend's origin(s), comma-separated. **Empty by default and never `*`** —
    # see PortalSecurityConfig. An environment that forgets this gets a failing preflight, which
    # is loud; a wildcard would be silent and wrong.
    allowed-origins: ${EVALOS_PORTAL_ORIGINS:}
    # **Two origins, one per app a person is ever sent to.** `base-url` was a third and is DELETED:
    # it named whatever served `/portal/client`, a second copy of the client portal that lived
    # inside the STAFF SPA and was superseded by slice 34b. Nothing mints a client link any more —
    # clients reach the portal from a button on the website and sign in — so there is no base to
    # hold, and the expert base no longer falls back to it (an unset expert base used to mint
    # expert links onto the client's origin).
    #
    # The expert portal (client-expert/expert, split 2026-09-03). This link is the ONLY way an
    # expert is reached, so an unset value here does not fail loudly — it mints a link to the
    # wrong host, which looks like a broken link to the one participant EvalOS cannot train.
    expert-base-url: ${PORTAL_EXPERT_BASE_URL:http://localhost:5175}
    # The client portal (client-expert/client). Builds one URL and only one: the set-password mail.
    client-base-url: ${PORTAL_CLIENT_BASE_URL:http://localhost:5174}
    # How long a link works. A draft-review link that never expired would be a permanent bearer
    # credential sitting in somebody's inbox; re-minting is one click, so a short life costs
    # little. Configurable because "how long does the client have" is a business question.
    link-ttl: ${PORTAL_LINK_TTL:P30D}
    # A **party**-scoped link (Unit 35, D1) opens every case that person has, so it is the wider
    # credential of the two and must not live as long. Seven days survives a weekend and a chase;
    # it is dead before a forwarded link is forgotten. Re-minting is one click, which is what makes
    # a short life cheap. Deliberately a separate property rather than a fraction of the one above:
    # they answer different business questions and will drift apart.
    party-link-ttl: ${PORTAL_PARTY_LINK_TTL:P7D}
    # Requests per minute per caller on the portal chain, refused before the token is looked at.
    # Generous for one client reading one page, and low enough that guessing a 256-bit token is
    # not made cheaper by trying.
    #
    # Note precisely what this bounds: PortalTokenFilter keys it on getRemoteAddr(), so it limits
    # a *caller*, not a *token*. That is the right key for "stop someone guessing tokens" and the
    # wrong one for "stop one link holder filling a case's Drive folder" — the uploads in Units 21
    # and 15 need a second, per-token budget, which is new work and not something this setting
    # already covers. Give it its own property then; do not stretch this one to mean both.
    rate-limit-per-minute: ${PORTAL_RATE_LIMIT:60}
  s3:
    # The document store (Unit 30). **No defaults for either value** — an environment that forgets
    # them gets 502s on document routes and a warning at boot, never a silent write to the wrong
    # bucket. The AWS credential itself is not a property at all: the SDK's default provider chain
    # reads the environment, the shared profile or the instance role, so no credential can end up
    # in a committed yaml (`ConfigSecretsTest` fails the build if one does).
    bucket: ${EVALOS_S3_BUCKET:}
    region: ${EVALOS_S3_REGION:}
  ghl:
    # The GHL public API, read-only. Only the marketing pipeline view uses it: EvalOS reads
    # GHL's Google Ads funnel and writes nothing back, because GHL owns the front of house.
    base-url: ${GHL_API_BASE_URL:https://services.leadconnectorhq.com}
    # GHL versions its public API by request header, not by path. A name, not a secret, so it
    # has a default — and a version bump is then an environment change and not a build.
    api-version: ${GHL_API_VERSION:2021-07-28}
    # A GHL Private Integration Token with the `opportunities.readonly` scope, and nothing
    # wider. Read-only by grant as well as by code: the client here cannot write, and neither
    # should the credential, so that a mistake in either place is still not a write to GHL.
    #
    # Defaults to empty rather than being absent, and that is a deliberate difference from
    # JWT_SECRET and EVALOS_FIELD_KEY. Those two must fail the boot, because signing with a
    # guess or storing plaintext is unrecoverable. This one gates one read-only GM screen: an
    # environment that forgets it should serve the whole app and answer 502 on that one view,
    # not refuse to start. GhlPipelineClient logs the warning at boot so it is not a surprise.
    token: ${GHL_API_TOKEN:}
    # The GHL sub-account (location) to read. Blank has the same effect as a blank token.
    #
    # NOTE THE SCOPE THIS SETS, and note what it does NOT mean. It is ONE location for the whole
    # deployment. Each brand has its own GHL sub-account, so whatever is set here is ONE brand's
    # funnel — not a cross-brand total. EvalOS has no mapping from a location to a brand, so it
    # cannot say which brand, cannot label it, and cannot filter by it.
    #
    # That is why every screen over it is GM-only — see GmOverviewService and the nav's
    # `readsGhlLocation` marker. An unattributable figure must not be shown to a role locked to one
    # brand, because neither they nor the server can tell whether it is theirs. Do NOT widen a gate
    # to make a screen useful to its audience: that was the trade offered for the two funnel
    # screens on 2026-09-16, and the business removed the screens instead. Do not add a second
    # global location here either: Unit 25 puts the location on `brand`, which is the only thing
    # that makes a second brand — or a Marketing-readable funnel — configurable.
    location-id: ${GHL_LOCATION_ID:}
    # **Unit 43's intake funnel, by name for the same reason as every other pipeline here.**
    # A client picking a service opens an opportunity on this pipeline at the stage below, which
    # is what puts a self-service lead on a salesperson's board the moment they start rather than
    # when they finish.
    #
    # **Blank by default, and that is the safe direction.** `GhlPipelineClient.pipelineNamed`
    # matches nothing on an empty name and answers 502 — so an unconfigured environment refuses
    # to open a request and says why, instead of filing every client's application into whichever
    # pipeline GHL happened to return first.
    #
    # **There is no stage property beside this, and that is a decision.** EvalOS puts the
    # opportunity on this pipeline and stops: which stage it lands in, and who it is assigned to,
    # are GHL's automation's job. A `hot-stage-name` existed here briefly and was removed — it made
    # EvalOS hold a second opinion about pipeline placement, which goes stale the first time
    # somebody reworks the workflow in GHL.
     # The GHL opportunity custom field that carries the requested service — the one input GHL's
    # own workflow needs to route a client's request to the right pipeline.
    #
    # **THIS IS WHAT MAKES "assign the pipeline by service" POSSIBLE, and it is the whole of
    # EvalOS's part in it.** A GHL workflow triggered by opportunity-created can branch on a custom
    # field; it cannot branch on the free text in the opportunity's NAME, which is the only place
    # the service appeared before. So EvalOS states the fact it owns — which service was asked for
    # — and GHL decides which pipeline that belongs on. Mapping eighteen services onto four sales
    # pipelines is a business rule, and it lives in the workflow for the same reason the stage
    # does: a copy here goes stale the first time somebody reworks the routing over there.
    #
    # **The value sent is the service ID** (`academic_evaluation`, `eb1a_expert_opinion_letter`, …
    # see the client portal's `serviceCatalog.ts`), not the display name. The name is for a human
    # reading a board and changes when the catalog is reworded; the id is the stable slug a
    # workflow condition can be written against.
    #
    # **The GHL custom field ID, not its name or key** — an opaque 20-character string, the same
    # shape as `team_member.ghl_pipeline_id` and for the same reason: a field renamed in GHL must
    # not silently stop routing. Read it from GHL under Settings → Custom Fields (object:
    # Opportunity), or from `GET /api/sales/opportunity-fields`, which the sales desk already
    # calls.
    #
    # **Blank omits the field and nothing else changes.** The deal is still opened on the intake
    # pipeline and still names the person and the service; it simply lands wherever GHL's default
    # routing puts it. An environment that has not created the field yet must not lose the lead
    # over it.
    opportunity-service-field: ${GHL_OPPORTUNITY_SERVICE_FIELD:}
    # The GHL opportunity custom field that says the client finished the questionnaire.
    #
    # **This exists because of D10**: the opportunity is opened when the client PICKS a service, not
    # when they submit, so that a client who abandons halfway still reaches a salesperson. The cost
    # of that decision is that a deal on the board says nothing about whether it is somebody
    # browsing or a finished request. This field is the difference, and it gives GHL a second
    # workflow trigger — notify, move a stage, start a sequence — without EvalOS holding any opinion
    # about which.
    #
    # The value written is the constant `SUBMITTED`. Deliberately not configurable: a value a
    # deployer could change is one a GHL workflow condition would have to be kept in step with by
    # hand, and there is nothing to gain from the two disagreeing.
    #
    # A GHL custom field ID, same shape and same sourcing as the line above. Blank skips the call —
    # the request is still submitted in EvalOS, which is where it lives.
    opportunity-submitted-field: ${GHL_OPPORTUNITY_SUBMITTED_FIELD:}
    # The GHL opportunity custom field carrying EvalOS's own opportunity id -- the CORRELATION KEY.
    #
    # **This is `00d` §6.1, which calls it "the single biggest sequencing error in `00c`".** The
    # outbox gives at-least-once delivery, and `POST /opportunities/` is not idempotent, so a retry
    # after a TIMEOUT is exactly how one opportunity becomes two: EvalOS cannot tell "GHL never got
    # it" from "GHL got it and the answer was lost". The fix is a key EvalOS chooses, writes into a
    # custom field on create, and can look for afterwards.
    #
    # **The key is persisted BEFORE the call**, in `opportunity.id` -- a key minted in memory and
    # lost to a timeout is a key no retry can search for.
    #
    # **Reading it back is not a filter GHL offers, and that is a correction to §6.1's wording.**
    # Verified against the API: neither `GET /opportunities/search` nor the advanced POST accepts a
    # custom-field filter. The implementable form is to ask GHL for the CONTACT's opportunities --
    # `contactId` IS a supported filter -- and match the correlation value locally. One contact has
    # a handful of deals, and a retry-after-timeout is rare.
    #
    # A GHL custom field ID, same shape and sourcing as the two above. Blank omits the field: the
    # deal is still created, and the duplicate risk on a retry is simply the one that exists today.
    opportunity-correlation-field: ${GHL_OPPORTUNITY_CORRELATION_FIELD:}
    # Which brand owns `location-id`. Unit 36's single-brand ceiling, and it is ENFORCED rather
    # than documented: assigning SALES or MARKETING to a member of any other brand answers 400.
    #
    # WHY THIS EXISTS. `location-id` above has no link to a brand, which invariant 1 licenses as
    # its one stated exception by making every screen over it GM-only. SALES and MARKETING are
    # brand-LOCKED, so the moment one of them reads that location the exception's argument
    # ("EvalOS cannot tell whose, so only the cross-brand role may look") stops holding. Naming
    # the brand here NARROWS the exception rather than widening it.
    #
    # ponytail: one GHL location, so one selling brand. Unit 25 (location + token per brand) is
    # the upgrade path, and the trigger is a business event — a second brand starts selling.
    #
    # Blank means no brand may hold a pipeline-scoped role, which is the safe default for an
    # environment that has not been told which brand sells.
    sales-brand: ${GHL_SALES_BRAND_ID:}
    # When a board tells its reader the mirror has not been confirmed against GHL lately
    # (Unit 46). **This is not a refresh trigger** — the board makes no GHL request at all any
    # more, so nothing acts on it; it is a label.
    #
    # 5 minutes — one missed sweep, set by the business on 2026-09-17 over a proposed 15. The
    # reasoning for the shorter number: this is the only thing telling a salesperson that new GHL
    # leads have stopped arriving, and being told one cycle late is the point of having it.
    #
    # **Known consequence, so it is not a surprise later:** the threshold equals the sweep interval,
    # so the mirror's age reaches it just as the next pass is due — a pass that runs a few seconds
    # long, or starts late, will show "Sync delayed" briefly before clearing itself. That is the
    # trade for a one-cycle warning. If the blink becomes noise, raise this to 6m rather than
    # slowing the sweep, because the sweep interval is the thing a reader actually feels.
    #
    # It replaced `board-cache-ttl`, which was the TTL of a refill-on-read that Unit 46 deleted.
    board-stale-after: ${GHL_BOARD_STALE_AFTER:5m}
    # How stale a pipeline nobody is looking at may get before the MIRROR_DELTA sweep re-reads it
    # (Unit 45d). Deliberately SHORTER than that sweep's interval: the TTL is the freshness
    # promised, the interval is how often it is checked, and a TTL equal to the interval would
    # double to 30 minutes on nothing worse than clock jitter between two passes.
    #
    # Nothing in it is a delta: GHL's opportunity search filters on createdAt and has no
    # updated-since filter at all, so "delta" here means a stale PIPELINE, never a changed row.
    # Webhooks are what make a change current within seconds; this is the floor under them.
    #
    # 4 minutes under a 5-minute sweep (2026-09-17): the board reads the mirror and nothing else,
    # so this TTL is the only thing deciding how old a pipeline may be, and a TTL at or above the
    # interval would let clock jitter skip a pass and silently double the age.
    delta-ttl: ${GHL_MIRROR_DELTA_TTL:4m}
    # Connect and read timeout on each GHL request. Required because this runs in a
    # controller-triggered path, and a bound is what keeps it "one bounded request" rather than
    # long-lived work (invariant 6). The read is paginated, so the bound is per page and not for
    # the whole read.
    timeout: ${GHL_TIMEOUT:10s}
  jobs:
    # The background sweeps (Unit 19). Off in the integration suite, on everywhere else — see
    # JobSchedule for why the default points that way.
    enabled: ${EVALOS_JOBS_ENABLED:true}
    # Every interval is a fixed DELAY, not a rate: the gap is measured from the end of the last
    # run, so a slow sweep cannot stack on top of itself. Between the delay and the advisory
    # lock, a sweep overlapping a sweep is impossible in both directions.
    #
    # **Keyed by JOB_TYPE, and that is load-bearing rather than tidy.** Two things read these:
    # the `@Scheduled` on each sweep, and the staleness check behind the admin panel's "this
    # sweep has stopped" warning. A separate list of intervals for the second would be a second
    # number that drifts from the first, and the drift is invisible — the panel would simply
    # stop warning, which is the exact failure the panel exists to catch.
    intervals:
      # 30 minutes on the three that measure a 24h+ clock. A finer interval would not make a
      # case late any sooner; it would only land the chase nearer the exact hour, which nobody
      # asked for, and multiply the ledger rows a GM has to read past.
      DOC_CHASE: ${JOBS_DOC_CHASE_INTERVAL:30m}
      DOC_ESCALATION: ${JOBS_DOC_ESCALATION_INTERVAL:30m}
      EXPERT_SIGN: ${JOBS_EXPERT_SIGN_INTERVAL:30m}
      # 15 minutes: this one refreshes the column the board's RAG rail is painted from, so its
      # interval is how stale a status light may be. Faster than the chases and for a different
      # reason — it feeds a screen, not a deadline.
      STAGE_SLA: ${JOBS_STAGE_SLA_INTERVAL:15m}
      # The pipeline mirror (Unit 44a). **An hour, and the slowness is the point**: pipelines are
      # structure, not traffic — a GM adds one every few months. Fifteen minutes would spend the
      # GHL budget on an answer that has not changed since the last twenty passes, and no screen
      # needs a stage name the instant it appears.
      PIPELINE_MIRROR: ${JOBS_PIPELINE_MIRROR_INTERVAL:1h}
      # The location's reference lists — custom fields, calendars, users (Unit 47). **An hour, for
      # the pipeline mirror's reason exactly**: these are structure, not traffic. Somebody adds a
      # calendar or a custom field a few times a year, and no form needs one the instant it exists.
      # One interval for all three because they change at the same speed; three sweeps would be
      # three chances for one of them to be the one that quietly stopped.
      REFERENCE_MIRROR: ${JOBS_REFERENCE_MIRROR_INTERVAL:1h}
      # The nightly sync audit (Unit 45b). **24 hours, and the length is a budget decision.** This
      # is the longest read EvalOS makes -- a paged full list of every opportunity on every mirrored
      # pipeline, roughly 30 seconds of GHL's shared 100-per-10-seconds allowance. Hourly would
      # spend a meaningful share of that budget on a question whose answer changes slowly, and
      # starve the desks while it did.
      SYNC_AUDIT: ${JOBS_SYNC_AUDIT_INTERVAL:24h}
      # The outbox drain (Unit 45c). **Two minutes, and this is the one interval chosen for a person
      # rather than a budget.** What is queued is a client's request reaching Sales after a GHL
      # outage; every minute it sits is a minute a salesperson does not know the lead exists. An
      # hour, like the pipeline mirror's, would make the queue itself the outage.
      SYNC_OUTBOX: ${JOBS_SYNC_OUTBOX_INTERVAL:2m}
      # The mirror delta sweep (Unit 45d). **15 minutes, and it is nearly free at that rate**:
      # refreshIfStale is a no-op for any pipeline a desk has read inside `ghl.delta-ttl`, so the
      # cost is one paged list per pipeline NOBODY is looking at. Those are the rows whose
      # staleness the nightly audit would otherwise report as drift, and the pipeline-scope check
      # (`isOnPipeline`) would otherwise answer from — a deal moved to another rep's board stays
      # authorised here until something re-reads it, and within a working day is the bar.
      # **5 minutes as of 2026-09-17, and the board is why.** Unit 46 took the refill off the
      # request path, so this sweep and the webhooks are now the ONLY things that put a new GHL
      # lead in front of a salesperson. Fifteen minutes was a floor under webhooks; five is a
      # cadence somebody waits on. It is still cheap: refreshIfStale is a no-op inside `delta-ttl`,
      # and the manual Refresh button on the board covers the case of not wanting to wait at all.
      MIRROR_DELTA: ${JOBS_MIRROR_DELTA_INTERVAL:5m}
      # Portal cleanup (expired credential tokens, abandoned sign-ups). **Daily, and the slowness
      # is deliberate**: nothing downstream reads these rows, so the only thing an hourly pass
      # would buy is a slightly smaller table and 24x the ledger rows a GM reads past. It is also
      # the one sweep that DELETES, and a daily cadence keeps a mistake's blast radius to one pass.
      PORTAL_CLEANUP: ${JOBS_PORTAL_CLEANUP_INTERVAL:24h}
    # How many missed intervals before the panel calls a sweep stopped. Four rather than two so
    # one slow pass or one restart is not an alarm; low enough that a scheduler that died is
    # named within a couple of hours rather than the next morning.
    stale-after-intervals: ${JOBS_STALE_AFTER:4}
server:
  port: ${SERVER_PORT:8080}
  # Whether to trust X-Forwarded-* and resolve the real client address.
  #
  # `none` by default, and that default is the safe one: with nothing in front of the app, honouring
  # X-Forwarded-For would let any caller present a fresh address per request and walk straight past
  # the portal chain's per-caller rate limit. Set this to `framework` **only** in an environment
  # where a trusted proxy or load balancer terminates the connection — there it is required, because
  # otherwise every portal client resolves to the proxy's address and shares one rate-limit budget.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # **Off, because /actuator/health is the only exposed endpoint and it is permitAll.** Mail is
    # blank by default and degrades on purpose (see evalos.mail.from), but Boot's mail indicator
    # would drag the aggregate to DOWN over it — and a liveness or readiness probe reading that
    # pulls a healthy instance out of service over a feature that is designed to be optional.
    mail:
      enabled: false
