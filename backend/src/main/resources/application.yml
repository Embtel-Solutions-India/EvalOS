spring:
  application:
    name: evalos
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema. Never create/update.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # The expert sheet upload (Unit 11), and the only multipart endpoint in EvalOS.
      # file-size-threshold matches max-file-size on purpose: above the threshold the
      # container spools the upload to a temp file, and EvalOS hosts no files
      # (invariant 14) — a roster sheet is parsed in memory and never lands on disk.
      # A roster is tens of rows, so 5 MB is already generous for a .xlsx.
      max-file-size: ${UPLOAD_MAX_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_SIZE:5MB}
      file-size-threshold: ${UPLOAD_MAX_SIZE:5MB}

evalos:
  security:
    jwt:
      # HS256 signing key, 32 bytes minimum. No default on purpose: an
      # environment that forgets it must fail to start, not sign with a guess.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT8H}
    # AES-256 key for the one encrypted field (expert.payment_detail), base64 of
    # exactly 32 bytes. No default, for the same reason as the signing key: an
    # environment that forgets it must fail to start, not write plaintext.
    field-key: ${EVALOS_FIELD_KEY}
  portal:
    # Where a minted portal link points. The SPA serves /portal/client, so this is the client
    # app's own origin — defaulted to the Vite dev server because that is where it is correct
    # for every developer, and it must be set to the real origin in any deployed environment or
    # the link mailed to a client points at somebody's laptop.
    base-url: ${PORTAL_BASE_URL:http://localhost:5173}
    # How long a link works. A draft-review link that never expired would be a permanent bearer
    # credential sitting in somebody's inbox; re-minting is one click, so a short life costs
    # little. Configurable because "how long does the client have" is a business question.
    link-ttl: ${PORTAL_LINK_TTL:P30D}
    # Requests per minute per caller on the portal chain, refused before the token is looked at.
    # Generous for one client reading one page, and low enough that guessing a 256-bit token is
    # not made cheaper by trying.
    rate-limit-per-minute: ${PORTAL_RATE_LIMIT:60}
  webhook:
    # Which request header carries the inbound HMAC. Has a default because it is a
    # name, not a secret, and GHL's actual header is not yet confirmed — point this
    # at the real one when it is, without a code change.
    signature-header: ${WEBHOOK_SIGNATURE_HEADER:X-Evalos-Signature}
  drive:
    # Google service-account credentials for the Drive write (Unit 13). Two sources
    # because a container secret and a mounted volume take different shapes; inline
    # wins if both are set. Both default to empty rather than being absent, so that
    # setting *either* one starts the app — the "an environment that forgets it must
    # fail to start" rule is enforced by `required` below instead of by an
    # unresolvable placeholder, which could only ever demand one specific variable.
    key-json: ${GOOGLE_DRIVE_KEY_JSON:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    # True here and false only on `local`. GoogleDriveConfig refuses to build the
    # context when this is true and neither source above is set, which is the same
    # rule EVALOS_FIELD_KEY and JWT_SECRET set: a deployed environment that forgets
    # the key must fail to start, not start and then fail at the first upload in
    # front of a waiting client.
    required: ${DRIVE_REQUIRED:true}
    # drive.file is least privilege: create files, and reach nothing the app did not
    # create or was not explicitly given. If the live upload ever answers 403 on a
    # correctly-shared folder, the fallback is
    # https://www.googleapis.com/auth/drive — a property, not a code change, because
    # the person debugging that has an environment and not a build.
    scope: ${DRIVE_SCOPE:https://www.googleapis.com/auth/drive.file}
    # Connect and read timeout on the upload. It runs in a controller-triggered path,
    # so a bound is what keeps it "one bounded request" rather than long-lived work
    # (invariant 6). If it stops fitting, the upload moves to `job` (Unit 19).
    timeout: ${DRIVE_TIMEOUT:20s}

server:
  port: ${SERVER_PORT:8080}
  # Whether to trust X-Forwarded-* and resolve the real client address.
  #
  # `none` by default, and that default is the safe one: with nothing in front of the app, honouring
  # X-Forwarded-For would let any caller present a fresh address per request and walk straight past
  # the portal chain's per-caller rate limit. Set this to `framework` **only** in an environment
  # where a trusted proxy or load balancer terminates the connection — there it is required, because
  # otherwise every portal client resolves to the proxy's address and shares one rate-limit budget.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
