spring:
  application:
    name: evalos
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # **Never a value here, not even locally** — ConfigSecretsTest fails the build on a
    # credential-shaped setting carrying a default in a shared profile. The real value goes in
    # backend/config/application-local.yml (gitignored) or the environment.
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # **Jakarta Mail defaults all three of these to INFINITE.** Required for the same reason
      # `evalos.ghl.timeout` below is: this send runs inside a controller-triggered @Transactional,
      # from a route that is unauthenticated and permits 60 requests/min/IP. A black-holed SMTP
      # host with no bound parks the request thread AND its Hikari connection forever, and enough
      # of those take the staff API down with the portal. A bound is what keeps it "one bounded
      # request" (invariant 6).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema. Never create/update.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Two endpoints now: the expert roster sheet (Unit 11) and the client document upload
      # (Unit 30). **The trade this block deferred to "Unit 21, not before" is settled here**,
      # because Unit 30 is that upload under a different number.
      #
      # `file-size-threshold` still equals `max-file-size`, and that is the load-bearing line:
      # above the threshold the container spools to a temp file, and EvalOS hosts no files
      # (invariant 14). Keeping them equal buys "never spools to disk" by buffering the part in
      # heap instead — so the cap and the per-request heap exposure are the same number.
      #
      # 15 MB because a scanned transcript is not a roster sheet. At 50-100 cases per brand per
      # month the concurrent-upload count is tiny, so 15 MB of transient heap per in-flight upload
      # is affordable; at ten times the volume this becomes the streaming rewrite the old note
      # described, not a bigger number.
      #
      # **`max-request-size` is deliberately LARGER than `max-file-size`.** They were equal, which
      # meant a file at exactly the cap plus its `checklistItemId` field exceeded the request cap
      # and was rejected for being one form field too big — a limit that fires before the one the
      # user was told about.
      max-file-size: ${UPLOAD_MAX_SIZE:15MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:16MB}
      file-size-threshold: ${UPLOAD_MAX_SIZE:15MB}

evalos:
  security:
    jwt:
      # HS256 signing key, 32 bytes minimum. No default on purpose: an
      # environment that forgets it must fail to start, not sign with a guess.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT8H}
    # AES-256 key for the one encrypted field (expert.payment_detail), base64 of
    # exactly 32 bytes. No default, for the same reason as the signing key: an
    # environment that forgets it must fail to start, not write plaintext.
    field-key: ${EVALOS_FIELD_KEY}
  workload:
    # How many open cases a Case Manager is considered fully loaded by. The denominator behind
    # every capacity percentage on the PM dashboard, and therefore behind ui-context.md's fixed
    # RAG bands (green <70%, amber 70-90%, red >90%).
    #
    # One number for the brand rather than a column on team_member, deliberately: per-person
    # capacity needs an admin screen to maintain and a reason to differ, and neither exists yet.
    # Add `team_member.capacity` the day part-time or junior loads actually diverge — the bands
    # and the display do not change when it does.
    cases-per-cm: ${WORKLOAD_CASES_PER_CM:12}
  roster:
    # How many experts the network aims to onboard each month. The denominator behind the ENM's
    # "onboarded vs target" tile. One number per brand for the same reason cases-per-cm is
    # (decision 4's shape): the count over expert.date_onboarded was always computable, only the
    # target had nowhere to live.
    monthly-onboarding-target: ${ROSTER_MONTHLY_TARGET:5}
  mail:
    # Unit 42 — EvalOS's ONLY outbound mail, and invariant 14 is amended to exactly this much:
    # proving control of a client's own address. Set-password and reset-password, nothing else.
    # A status email, a marketing email or a notification email is a different decision and gets
    # argued in its own unit.
    #
    # **Blank degrades rather than failing the boot.** An environment that forgets it serves the
    # whole app and answers NO_PASSWORD with "please contact us" — the same reasoning that gave
    # GHL_API_TOKEN an empty default rather than a fatal one. A password reset is recoverable by
    # a support conversation; a refused boot is not recoverable by anyone.
    from: ${EVALOS_MAIL_FROM:}
  portal:
    # Which brand this portal deployment serves. **NOT evalos.ghl.sales-brand** — that one names
    # which brand's STAFF may hold the SALES and MARKETING roles, a staff-authorization ceiling
    # on the normal chain. Nothing on the portal chain has roles. A second brand is a second
    # portal deployment with its own value here.
    client-brand: ${EVALOS_PORTAL_CLIENT_BRAND:}
    # How long a set-password or reset-password link lives. Thirty minutes: long enough to walk
    # to another device, short enough that a forwarded mailbox is not a standing credential.
    #
    # **The key and its variable deliberately do not match, and this is not an oversight.**
    # ConfigSecretsTest fails the build on any variable whose NAME contains CREDENTIAL and which
    # carries a non-empty default — a deliberately blunt rule, because guessing secrets from their
    # values misses short ones. A TTL is not a secret, so the variable is named for what it is to
    # a deployer (the sign-in link's lifetime) instead. Renaming it to EVALOS_PORTAL_CREDENTIAL_TTL
    # to "fix" the mismatch reintroduces that build failure.
    credential-ttl: ${EVALOS_PORTAL_SIGNIN_LINK_TTL:30m}
    # The portal frontend's origin(s), comma-separated. **Empty by default and never `*`** —
    # see PortalSecurityConfig. An environment that forgets this gets a failing preflight, which
    # is loud; a wildcard would be silent and wrong.
    allowed-origins: ${EVALOS_PORTAL_ORIGINS:}
    # Where a minted portal link points. The SPA serves /portal/client, so this is the client
    # app's own origin — defaulted to the Vite dev server because that is where it is correct
    # for every developer, and it must be set to the real origin in any deployed environment or
    # the link mailed to a client points at somebody's laptop.
    base-url: ${PORTAL_BASE_URL:http://localhost:5173}
    # **The expert portal is a different application on a different origin** (client-expert/expert,
    # split 2026-09-03), so its links cannot be built from the client's base. Defaults to the
    # expert Vite dev server. Set it in every deployed environment: an unset value here does not
    # fail loudly — it mints a link to the wrong host, which looks like a broken link to the one
    # participant EvalOS cannot train.
    expert-base-url: ${PORTAL_EXPERT_BASE_URL:http://localhost:5175}
    # **The client portal app is a third origin, and this is not `base-url`.** `base-url` above
    # points at whatever serves `/portal/client`, which is the STAFF SPA (port 5173, and its own
    # default). `/set-password` — the only thing this property builds — exists only in
    # `client-expert/client` on 5174. Sharing one property meant the set-password mail landed a
    # client on the staff sign-in page with their credential in the fragment. Same argument as
    # `expert-base-url` directly above, one app later.
    client-base-url: ${PORTAL_CLIENT_BASE_URL:http://localhost:5174}
    # How long a link works. A draft-review link that never expired would be a permanent bearer
    # credential sitting in somebody's inbox; re-minting is one click, so a short life costs
    # little. Configurable because "how long does the client have" is a business question.
    link-ttl: ${PORTAL_LINK_TTL:P30D}
    # A **party**-scoped link (Unit 35, D1) opens every case that person has, so it is the wider
    # credential of the two and must not live as long. Seven days survives a weekend and a chase;
    # it is dead before a forwarded link is forgotten. Re-minting is one click, which is what makes
    # a short life cheap. Deliberately a separate property rather than a fraction of the one above:
    # they answer different business questions and will drift apart.
    party-link-ttl: ${PORTAL_PARTY_LINK_TTL:P7D}
    # Requests per minute per caller on the portal chain, refused before the token is looked at.
    # Generous for one client reading one page, and low enough that guessing a 256-bit token is
    # not made cheaper by trying.
    #
    # Note precisely what this bounds: PortalTokenFilter keys it on getRemoteAddr(), so it limits
    # a *caller*, not a *token*. That is the right key for "stop someone guessing tokens" and the
    # wrong one for "stop one link holder filling a case's Drive folder" — the uploads in Units 21
    # and 15 need a second, per-token budget, which is new work and not something this setting
    # already covers. Give it its own property then; do not stretch this one to mean both.
    rate-limit-per-minute: ${PORTAL_RATE_LIMIT:60}
  s3:
    # The document store (Unit 30). **No defaults for either value** — an environment that forgets
    # them gets 502s on document routes and a warning at boot, never a silent write to the wrong
    # bucket. The AWS credential itself is not a property at all: the SDK's default provider chain
    # reads the environment, the shared profile or the instance role, so no credential can end up
    # in a committed yaml (`ConfigSecretsTest` fails the build if one does).
    bucket: ${EVALOS_S3_BUCKET:}
    region: ${EVALOS_S3_REGION:}
  ghl:
    # The GHL public API, read-only. Only the marketing pipeline view uses it: EvalOS reads
    # GHL's Google Ads funnel and writes nothing back, because GHL owns the front of house.
    base-url: ${GHL_API_BASE_URL:https://services.leadconnectorhq.com}
    # GHL versions its public API by request header, not by path. A name, not a secret, so it
    # has a default — and a version bump is then an environment change and not a build.
    api-version: ${GHL_API_VERSION:2021-07-28}
    # A GHL Private Integration Token with the `opportunities.readonly` scope, and nothing
    # wider. Read-only by grant as well as by code: the client here cannot write, and neither
    # should the credential, so that a mistake in either place is still not a write to GHL.
    #
    # Defaults to empty rather than being absent, and that is a deliberate difference from
    # JWT_SECRET and EVALOS_FIELD_KEY. Those two must fail the boot, because signing with a
    # guess or storing plaintext is unrecoverable. This one gates one read-only GM screen: an
    # environment that forgets it should serve the whole app and answer 502 on that one view,
    # not refuse to start. GhlPipelineClient logs the warning at boot so it is not a surprise.
    token: ${GHL_API_TOKEN:}
    # The GHL sub-account (location) to read. Blank has the same effect as a blank token.
    #
    # NOTE THE SCOPE THIS SETS, and note what it does NOT mean. It is ONE location for the whole
    # deployment. Each brand has its own GHL sub-account, so whatever is set here is ONE brand's
    # funnel — not a cross-brand total. EvalOS has no mapping from a location to a brand, so it
    # cannot say which brand, cannot label it, and cannot filter by it.
    #
    # That is why the endpoint is GM-only and takes no brandId — see MarketingPipelineService. An
    # unattributable figure must not be shown to a role locked to one brand, because neither they
    # nor the server can tell whether it is theirs. Do NOT add a brandId parameter to make it look
    # scoped, and do not add a second global location here: Unit 25 puts the location on `brand`,
    # which is the only thing that makes a second brand configurable.
    location-id: ${GHL_LOCATION_ID:}
    # Which pipeline the marketing view draws. Looked up by NAME rather than by id, because the
    # id is opaque and the name is what whoever provisions this can see in GHL. Renaming the
    # pipeline over there makes this view answer 502 saying so, which is the right direction to
    # fail in — the alternative is an empty funnel that looks like a bad month.
    ads-pipeline-name: ${GHL_ADS_PIPELINE_NAME:Google ADS Pipeline}
    # The second funnel on the same location: the email marketing pipeline. Same rules as the
    # line above — matched by name, breaks loudly on a rename.
    #
    # THREE NAMES, NOT A LIST. A list would need a slug per entry to route and label it, and the
    # slug is what the enum in MarketingPipelineService already is. The third funnel below was the
    # test of that instruction and it held: a property and a constant, no new code path. Keep
    # doing that; do not turn this into a map keyed by whatever GHL happens to call a pipeline
    # this quarter.
    email-pipeline-name: ${GHL_EMAIL_PIPELINE_NAME:Shivangi's Email Marketing}
    # The sales team's own funnel — same location, same rules, and NOT a marketing campaign. It is
    # here because the property is a GHL pipeline name like the two above; the screen it feeds
    # sits under the Sales nav heading rather than Marketing.
    #
    # THE NAME IN GHL HAS TWO SPACES IN IT ("Aditya's<space><space>pipeline"). This default has
    # one, deliberately, and it still matches: GhlPipelineClient collapses whitespace runs before
    # comparing, precisely so nobody has to notice or preserve an invisible character here. Do not
    # "correct" this line by pasting the double space back in — read that method's comment first.
    sales-pipeline-name: ${GHL_SALES_PIPELINE_NAME:Aditya's pipeline}
    # Connect and read timeout on each GHL request. Required because this runs in a
    # controller-triggered path, and a bound is what keeps it "one bounded
    # request" rather than long-lived work (invariant 6). The read is paginated, so the bound is
    # per page and not for the whole funnel.
    # Which brand owns `location-id`. Unit 36's single-brand ceiling, and it is ENFORCED rather
    # than documented: assigning SALES or MARKETING to a member of any other brand answers 400.
    #
    # WHY THIS EXISTS. `location-id` above has no link to a brand, which invariant 1 licenses as
    # its one stated exception by making every screen over it GM-only. SALES and MARKETING are
    # brand-LOCKED, so the moment one of them reads that location the exception's argument
    # ("EvalOS cannot tell whose, so only the cross-brand role may look") stops holding. Naming
    # the brand here NARROWS the exception rather than widening it.
    #
    # ponytail: one GHL location, so one selling brand. Unit 25 (location + token per brand) is
    # the upgrade path, and the trigger is a business event — a second brand starts selling.
    #
    # Blank means no brand may hold a pipeline-scoped role, which is the safe default for an
    # environment that has not been told which brand sells.
    sales-brand: ${GHL_SALES_BRAND_ID:}
    # How long a cached pipeline is considered fresh before the next board read refetches it
    # (Unit 38). Short, because a board is an operational screen and a salesperson dragging a
    # card expects to see it move; long enough that a room full of open boards is not a room
    # full of GHL calls against the 100-per-10-seconds-per-location budget.
    #
    # The cache is droppable: raising this trades freshness for requests and nothing else.
    board-cache-ttl: ${GHL_BOARD_CACHE_TTL:2m}
    timeout: ${GHL_TIMEOUT:10s}
    # How long one funnel read is served from memory before GHL is asked again.
    #
    # This is not a performance tweak, it is the rate limiter. Without it, N open dashboards are
    # N multi-page GHL reads per refresh and GHL's own rate limit becomes an EvalOS outage. Five
    # minutes on a sales funnel is invisible to a GM reading trend, and the payload carries
    # `readAt` so the screen states how old the figures are rather than implying they are live.
    cache-ttl: ${GHL_CACHE_TTL:PT5M}
  jobs:
    # The background sweeps (Unit 19). Off in the integration suite, on everywhere else — see
    # JobSchedule for why the default points that way.
    enabled: ${EVALOS_JOBS_ENABLED:true}
    # Every interval is a fixed DELAY, not a rate: the gap is measured from the end of the last
    # run, so a slow sweep cannot stack on top of itself. Between the delay and the advisory
    # lock, a sweep overlapping a sweep is impossible in both directions.
    #
    # **Keyed by JOB_TYPE, and that is load-bearing rather than tidy.** Two things read these:
    # the `@Scheduled` on each sweep, and the staleness check behind the admin panel's "this
    # sweep has stopped" warning. A separate list of intervals for the second would be a second
    # number that drifts from the first, and the drift is invisible — the panel would simply
    # stop warning, which is the exact failure the panel exists to catch.
    intervals:
      # 30 minutes on the three that measure a 24h+ clock. A finer interval would not make a
      # case late any sooner; it would only land the chase nearer the exact hour, which nobody
      # asked for, and multiply the ledger rows a GM has to read past.
      DOC_CHASE: ${JOBS_DOC_CHASE_INTERVAL:30m}
      DOC_ESCALATION: ${JOBS_DOC_ESCALATION_INTERVAL:30m}
      EXPERT_SIGN: ${JOBS_EXPERT_SIGN_INTERVAL:30m}
      # 15 minutes: this one refreshes the column the board's RAG rail is painted from, so its
      # interval is how stale a status light may be. Faster than the chases and for a different
      # reason — it feeds a screen, not a deadline.
      STAGE_SLA: ${JOBS_STAGE_SLA_INTERVAL:15m}
    # How many missed intervals before the panel calls a sweep stopped. Four rather than two so
    # one slow pass or one restart is not an alarm; low enough that a scheduler that died is
    # named within a couple of hours rather than the next morning.
    stale-after-intervals: ${JOBS_STALE_AFTER:4}
server:
  port: ${SERVER_PORT:8080}
  # Whether to trust X-Forwarded-* and resolve the real client address.
  #
  # `none` by default, and that default is the safe one: with nothing in front of the app, honouring
  # X-Forwarded-For would let any caller present a fresh address per request and walk straight past
  # the portal chain's per-caller rate limit. Set this to `framework` **only** in an environment
  # where a trusted proxy or load balancer terminates the connection — there it is required, because
  # otherwise every portal client resolves to the proxy's address and shares one rate-limit budget.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # **Off, because /actuator/health is the only exposed endpoint and it is permitAll.** Mail is
    # blank by default and degrades on purpose (see evalos.mail.from), but Boot's mail indicator
    # would drag the aggregate to DOWN over it — and a liveness or readiness probe reading that
    # pulls a healthy instance out of service over a feature that is designed to be optional.
    mail:
      enabled: false
